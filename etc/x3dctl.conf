# ==========================================================
# x3dctl default application profile mappings
# ==========================================================
#
# Format:
#   application=profile
#
# Notes:
#   - "application" must match the executable basename used with `x3dctl run`
#   - Example:
#       x3dctl run steam      -> matches "steam"
#       x3dctl run /usr/bin/steam -> also matches "steam"
#   - Shell aliases are NOT resolved by x3dctl config matching
#   - Flatpak wrappers must match the actual command used
#
# Supported profiles:
#
#   gaming
#     - Cache CCD affinity
#     - nice -5
#     - SCHED_OTHER
#     - IO best-effort level 0
#     - Best for cache-sensitive / latency-sensitive workloads
#
#   workstation
#     - Frequency CCD affinity
#     - nice 5
#     - SCHED_BATCH
#     - IO best-effort level 4
#     - Best for sustained background or content-creation workloads
#
#   frequency
#     - Frequency CCD affinity
#     - nice 0
#     - SCHED_OTHER
#     - IO best-effort level 0
#     - Best for general boost-oriented compute and bursty tasks
#
#   unrestricted
#     - No CPU affinity pinning
#     - nice -1
#     - SCHED_OTHER
#     - IO best-effort level 0
#     - Leaves all cores available while still applying light performance bias
#     - Especially useful with global "gaming" mode when you want:
#         * GPU IRQs steered away from the cache CCD
#         * full CPU scheduling freedom for modern multi-threaded games
#
# If no entry exists, x3dctl defaults to:
#   gaming
#
# IMPORTANT:
#   - File must be owned by root
#   - Must NOT be writable by group/others
#   - Lines beginning with '#' are ignored
#   - Whitespace around '=' is allowed
#   - Inline comments after values are supported
#
# ==========================================================


# -------------------------
# Gaming / Interactive
# -------------------------

#steam=gaming
#lutris=gaming
#heroic=gaming
#gamescope=gaming
#mangohud=gaming
#dolphin-emu=gaming
#pcsx2=gaming
#rpcs3=gaming
#yuzu=gaming
#discord=gaming


# -------------------------
#  Unrestricted Gaming/Modern Multi-Threaded
# (good candidates for unrestricted under global gaming mode)
# -------------------------
# Examples:
# game-launcher=unrestricted
# protontricks=unrestricted


# -------------------------
# Workstation / Editing
# -------------------------

#blender=workstation
#kdenlive=workstation
#davinci-resolve=workstation
#gimp=workstation
#inkscape=workstation
#obs=workstation


# -------------------------
# Frequency / Compute
# -------------------------

#make=frequency
#ninja=frequency
#gcc=frequency
#clang=frequency
#rustc=frequency
#ffmpeg=frequency
#handbrake=frequency
